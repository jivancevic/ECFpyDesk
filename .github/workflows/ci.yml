name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Windows and macOS minutes cost far more than Linux, so a PR runs on Linux
  # unless it touches what differs between systems. main always runs all three.
  # A docs-only PR builds nothing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      os: ${{ steps.diff.outputs.os }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          all='["ubuntu-latest","macos-latest","windows-latest"]'
          if [ -z "$PR" ]; then
            printf 'code=true\nos=%s\n' "$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only) || files=.github/unknown
          code=false
          printf '%s\n' "$files" | grep -qvE '^(docs/.*|[^/]+\.md)$' && code=true
          os='["ubuntu-latest"]'
          printf '%s\n' "$files" | grep -qE '^(native/|packaging/|srm/|requirements|\.github/)' && os=$all
          printf 'code=%s\nos=%s\n' "$code" "$os" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Linux covers the installed Boost; macOS and Windows cover the CMake download.
      - name: Install Boost
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libboost-dev
      - name: Build SRM
        run: |
          cmake -S native -B build
          cmake --build build --config Release --parallel 4
      - name: Smoke run
        run: python native/smoke_test.py
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py models views controllers utils
      - name: Generate a parameter file from every template
        run: |
          python - <<'PY'
          from models.config import ConfigurationManager
          manager = ConfigurationManager()
          for template, _ in manager.default_parameters_paths + manager.default_evaluation_parameters_paths:
              tree, _ = manager.parse_XML(template)
              manager.prepare_config(tree, template)
          PY
      - name: Run tests
        if: hashFiles('tests/**') != ''
        run: |
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi
          python -m pytest

  # The required check. It passes only when every system that ran passed, or
  # when a docs-only PR had nothing to build.
  ci:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          test "${{ needs.changes.result }}" = success
          case "${{ needs.build.result }}" in success|skipped) ;; *) exit 1 ;; esac
