name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Windows and macOS minutes cost far more than Linux, so a PR runs on Linux
  # unless it touches the native build, packaging or CI. main runs all three.
  # A docs-only change builds nothing, on a PR or on main. If this job fails,
  # the build runs on all three.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      os: ${{ steps.diff.outputs.os }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          all='["ubuntu-latest","macos-latest","windows-latest"]'
          # When the list cannot be read, this path takes the full build.
          unlisted=.github/could-not-list
          if [ -n "$PR" ]; then
            files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only) || files=$unlisted
            os='["ubuntu-latest"]'
          else
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename') || files=$unlisted
            os=$all
          fi
          code=false
          printf '%s\n' "$files" | grep -qvE '^(docs/.*|.*\.md)$' && code=true
          printf '%s\n' "$files" | grep -vE '\.md$' | grep -qE '^(native/|packaging/|srm/|requirements|\.github/)' && os=$all
          printf 'code=%s\nos=%s\n' "$code" "$os" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Linux covers the installed Boost; macOS and Windows cover the CMake download.
      - name: Install Boost
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libboost-dev
      - name: Build SRM
        run: |
          cmake -S native -B build
          cmake --build build --config Release --parallel 4
      - name: Smoke run
        run: python native/smoke_test.py
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py models views controllers utils
      - name: Generate a parameter file from every template
        run: |
          python - <<'PY'
          from models.config import ConfigurationManager
          manager = ConfigurationManager()
          for template, _ in manager.default_parameters_paths + manager.default_evaluation_parameters_paths:
              tree, _ = manager.parse_XML(template)
              manager.prepare_config(tree, template)
          PY
      - name: Run tests
        if: hashFiles('tests/**') != ''
        run: |
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi
          python -m pytest

  # The required check. It passes only when every system that ran passed, or
  # when a docs-only change had nothing to build.
  ci:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: case "${{ needs.build.result }}" in success|skipped) ;; *) exit 1 ;; esac
